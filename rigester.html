<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود ؛ ثبت نام | بازارینو</title>
    <link rel="stylesheet" href="./css/cssreset.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <header class="main-header">
      <nav class="main-header__navbar">
        <div class="main-header__rightside">
          <h1 class="main-header__logo"><a href="#">بازارینو</a></h1>
          <a href="./products.html" class="main-header__link">خانه</a>
          <a href="./products.html" class="main-header__link">فروشگاه</a>
          <a href="#" class="main-header__link">دسته بندی ها</a>
          <a href="#" class="main-header__link">درباره ما</a>
        </div>
        <div class="main-header__leftside">
          <div class="main-header__cart">
            <a href="#" class="main-header__link">سبد خرید</a>
            <span class="main-header__cart-count">۲</span>
          </div>
          <a href="./rigester.html" class="main-header__link">ورود</a>
        </div>
      </nav>
    </header>
    <header class="mobile-header">
      <label class="mobile-header__menue">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-menu preview-icon"
        >
          <path d="M4 5h16" />
          <path d="M4 12h16" />
          <path d="M4 19h16" />
        </svg>
        <input type="checkbox" />
      </label>
      <div class="mobile-header__logo"><a href="#">بازارینو</a></div>
      <div class="mobile-header__cart">
        <a href="#" class="mobile-header__link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-shopping-cart preview-icon"
          >
            <path
              d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"
            />
            <path
              d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"
            />
            <circle cx="18" cy="20" r="2" />
            <circle cx="8" cy="20" r="2" />
          </svg>
          <span class="mobile-header__cart-count">۲</span>
        </a>
      </div>
      <nav class="mobile-header__nav">
        <a href="./products.html" class="main-header__link">خانه</a>
        <a href="./rigester.html" class="main-header__link">ورود</a>
        <a href="./products.html" class="main-header__link">فروشگاه</a>
        <a href="#" class="main-header__link">دسته بندی ها</a>
        <a href="#" class="main-header__link">درباره ما</a>
      </nav>
    </header>
    <label class="mobile-search-bar">
      <input type="search" placeholder="جست و جو در محصولات" />
    </label>
    <main class="main register">
      <form action="/" method="get" class="register__form">
        <h1 class="register__title">ساخت حساب کاربری</h1>
        <p class="register__text">
          برای خرید سریع‌تر، حساب بازارینو را بسازید؛
        </p>
        <label class="register__lable">
          ایمیل
          <input type="email" placeholder="name@example.com" required />
        </label>
        <label class="register__lable">
          شماره همراه
          <input
            type="tel"
            required
            placeholder="09122221133"
            pattern="09[0-9]{9}|۰۹[۰-۹]{9}"
          />
        </label>
        <label class="register__lable">
          رمز عبور
          <input
            type="password"
            required
            placeholder="رمز عبور خود را وارد کنید"
            minlength="8"
            maxlength="64"
          />
        </label>
        <label class="register__lable">
          تکرار رمز عبور
          <input
            type="password"
            required
            placeholder="رمز عبور خود را دوباره وارد کنید"
            minlength="8"
            maxlength="64"
          />
        </label>
        <div class="register__button">
          <button type="reset">پاک کردن</button>
          <button type="submit">ثبت نام</button>
        </div>
      </form>
    </main>
    <footer class="footer">
      <p class="footer__copy">1405 &copy;</p>
      <div class="footer__links">
        <a href="#">پشتیبانی</a>
        .
        <a href="#">قوانین و شرایط</a>
        .
        <a href="#">اینستاگرام</a>
      </div>
      <a href="/" class="footer__link">بازارینو؛ خرید ساده و مطمئن</a>
    </footer>
  </body>
</html>
