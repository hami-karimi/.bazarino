<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود ؛ ثبت نام | بازارینو</title>
    <link rel="stylesheet" href="./css/cssreset.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <header class="main-header">
      <nav class="main-header__navbar">
        <div class="main-header__rightside">
          <h1 class="main-header__logo"><a href="#">بازارینو</a></h1>
          <a href="./products.html" class="main-header__link">خانه</a>
          <a href="./products.html" class="main-header__link">فروشگاه</a>
          <a href="#" class="main-header__link">دسته بندی ها</a>
          <a href="#" class="main-header__link">درباره ما</a>
        </div>
        <div class="main-header__leftside">
          <div class="main-header__cart">
            <a href="#" class="main-header__link">سبد خرید</a>
            <span class="main-header__cart-count">۲</span>
          </div>
          <a href="./rigester.html" class="main-header__link">ورود</a>
        </div>
      </nav>
    </header>
    <main class="main register">
      <form action="/" method="get" class="register__form">
        <h1 class="register__title">ساخت حساب کاربری</h1>
        <p class="register__text">
          برای خرید سریع‌تر، حساب بازارینو را بسازید؛
        </p>
        <label class="register__lable">
          ایمیل
          <input type="email" placeholder="name@example.com" required />
        </label>
        <label class="register__lable">
          شماره همراه
          <input
            type="tel"
            required
            placeholder="09122221133"
            pattern="09[0-9]{9}|۰۹[۰-۹]{9}"
          />
        </label>
        <label class="register__lable">
          رمز عبور
          <input
            type="password"
            required
            placeholder="رمز عبور خود را وارد کنید"
            minlength="8"
            maxlength="64"
          />
        </label>
        <label class="register__lable">
          تکرار رمز عبور
          <input
            type="password"
            required
            placeholder="رمز عبور خود را دوباره وارد کنید"
            minlength="8"
            maxlength="64"
          />
        </label>
        <div class="register__button">
          <button type="reset">پاک کردن</button>
          <button type="submit">ثبت نام</button>
        </div>
      </form>
    </main>
    <footer class="footer">
      <p class="footer__copy">1405 &copy;</p>
      <div class="footer__links">
        <a href="#">پشتیبانی</a>
        .
        <a href="#">قوانین و شرایط</a>
        .
        <a href="#">اینستاگرام</a>
      </div>
      <a href="/" class="footer__link">بازارینو؛ خرید ساده و مطمئن</a>
    </footer>
  </body>
</html>
